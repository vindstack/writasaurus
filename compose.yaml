services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: writasaurus
      POSTGRES_PASSWORD: local-dev-password
      POSTGRES_DB: writasaurus
    ports:
      - "5432:5432"
    volumes:
      - writasaurus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U writasaurus -d writasaurus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  writasaurus-postgres-data:
